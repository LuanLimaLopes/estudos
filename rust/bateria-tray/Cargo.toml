[package]
name = "bateria-tray"
version = "0.2.0"
edition = "2021"

[dependencies]
tray-icon = "0.19"
tao = "0.30"
hidapi = "2.6"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
